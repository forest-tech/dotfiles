# Catppuccin Mocha ANSI palette.
# Matches Ghostty's bundled "Catppuccin Mocha" theme.
# Palette source: /Applications/Ghostty.app/Contents/Resources/ghostty/themes/Catppuccin Mocha

set -s theme terminal

set -g pane-colours[0] '#45475a'
set -g pane-colours[1] '#f38ba8'
set -g pane-colours[2] '#a6e3a1'
set -g pane-colours[3] '#f9e2af'
set -g pane-colours[4] '#89b4fa'
set -g pane-colours[5] '#f5c2e7'
set -g pane-colours[6] '#94e2d5'
set -g pane-colours[7] '#a6adc8'
set -g pane-colours[8] '#585b70'
set -g pane-colours[9] '#f37799'
set -g pane-colours[10] '#89d88b'
set -g pane-colours[11] '#ebd391'
set -g pane-colours[12] '#74a8fc'
set -g pane-colours[13] '#f2aede'
set -g pane-colours[14] '#6bd7ca'
set -g pane-colours[15] '#bac2de'

set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=magenta'
