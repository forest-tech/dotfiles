# Core
unbind C-b
set -g prefix C-j
bind C-j send-prefix
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -s set-clipboard on
set -g allow-passthrough on

# Terminal: preserve application RGB and use the terminal ANSI palette for UI.
set -s default-terminal 'tmux-256color'
set -s terminal-overrides[100] '*:RGB'
set -s theme terminal

# Pane borders
set -g pane-active-border-style 'fg=magenta'
set -g pane-border-style 'fg=black'

# Split / reload
bind - split-window -v
bind ^ split-window -h
bind r source-file ~/.config/tmux/.tmux.conf \; display-message 'Reloaded!'

# Copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel

# Prefix + :autogrid (2-6 panes)
set -s command-alias[100] "autogrid=if -F '#{==:#{window_panes},2}' { select-layout even-vertical } { if -F '#{==:#{window_panes},3}' { select-layout 'b426,224x53,0,0{111x53,0,0,15,112x53,112,0[112x26,112,0,16,112x26,112,27,17]}' } { if -F '#{==:#{window_panes},4}' { select-layout '947a,224x53,0,0[224x26,0,0{112x26,0,0,18,111x26,113,0,21},224x26,0,27{112x26,0,27,19,111x26,113,27,20}]' } { if -F '#{==:#{window_panes},5}' { select-layout 'b1de,224x53,0,0{74x53,0,0,24,74x53,75,0[74x26,75,0,27,74x26,75,27,29],74x53,150,0[74x26,150,0,28,74x26,150,27,30]}' } { if -F '#{==:#{window_panes},6}' { select-layout '4126,224x53,0,0[224x26,0,0{74x26,0,0,31,74x26,75,0,33,74x26,150,0,34},224x26,0,27{74x26,0,27,32,74x26,75,27,35,74x26,150,27,36}]' } { display-message 'autogrid: supports 2-6 panes' } } } } }"

# TPM does not discover .config/tmux/.tmux.conf; keep one explicit plugin list.
# Load continuum after dotbar so its autosave command stays in status-right.
set -g @tpm_plugins 'tmux-plugins/tpm tmux-plugins/tmux-resurrect vaaleyard/tmux-dotbar tmux-plugins/tmux-continuum'
set -g @continuum-restore on
set -g @continuum-boot on
set -g @continuum-boot-options ghostty

# Dotbar: override its RGB defaults with terminal colors.
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-fg white
set -g @tmux-dotbar-fg-current 'white,bold'
set -g @tmux-dotbar-fg-session magenta
set -g @tmux-dotbar-fg-prefix magenta
set -g @tmux-dotbar-position top
run '~/.tmux/plugins/tpm/tpm'

# Dotbar hardcodes the zoom icon RGB; preserve its format with an ANSI color.
set -g window-status-current-format '#[fg=white,bold]#{E:window-status-format}#[fg=cyan]#{?window_zoomed_flag,󰊓,}'
