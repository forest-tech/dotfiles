# Reconstructed from the running tmux 3.5a server on 2026-10-07.
# Recovered behavior is preferred over reproducing accidental/broken bindings.

# =========================================
# Core
# =========================================

# Prefix
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# General behavior
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -s escape-time 0
set -s set-clipboard on

# Terminal / true color
set -s default-terminal 'tmux-256color'
set -as terminal-overrides ',*:RGB'

# For grahics
set -g allow-passthrough on

# =========================================
# Status line / Colors
# =========================================

# 以前のテーマ設定を初期化
set -gwu pane-colours
set -gwu window-style
set -gwu window-active-style

# テーマを読み込む
source-file ~/.config/tmux/themes/iceberg.conf

# =========================================
# Pane / window navigation
# =========================================

# Vim-style pane navigation
# bind -r h select-pane -L
# bind -r j select-pane -D
# bind -r k select-pane -U
# bind -r l select-pane -R

# Pane resize
# bind -r H resize-pane -L 5
# bind -r J resize-pane -D 5
# bind -r K resize-pane -U 5
# bind -r L resize-pane -R 5

bind - split-window -v
bind ^ split-window -h

# Reload config
bind r source-file ~/.config/tmux/.tmux.conf \; display-message 'Reloaded!'

# Window / pane numbers start at 1
set -g base-index 1
setw -g pane-base-index 1

# 閉じた後も番号を詰める
set -g renumber-windows on

# =========================================
# Copy mode
# =========================================

setw -g mode-keys vi

# These were present in the running key table.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel

# =========================================
# Layout helper
# =========================================

# Recovered custom command alias: prefix + :autogrid
# Supports 2-6 panes.
set -s command-alias[100] "autogrid=if -F '#{==:#{window_panes},2}' { select-layout even-vertical } { if -F '#{==:#{window_panes},3}' { select-layout 'b426,224x53,0,0{111x53,0,0,15,112x53,112,0[112x26,112,0,16,112x26,112,27,17]}' } { if -F '#{==:#{window_panes},4}' { select-layout '947a,224x53,0,0[224x26,0,0{112x26,0,0,18,111x26,113,0,21},224x26,0,27{112x26,0,27,19,111x26,113,27,20}]' } { if -F '#{==:#{window_panes},5}' { select-layout 'b1de,224x53,0,0{74x53,0,0,24,74x53,75,0[74x26,75,0,27,74x26,75,27,29],74x53,150,0[74x26,150,0,28,74x26,150,27,30]}' } { if -F '#{==:#{window_panes},6}' { select-layout '4126,224x53,0,0[224x26,0,0{74x26,0,0,31,74x26,75,0,33,74x26,150,0,34},224x26,0,27{74x26,0,27,32,74x26,75,27,35,74x26,150,27,36}]' } { display-message 'autogrid: supports 2-6 panes' } } } } }"

# =========================================
# TPM / session persistence
# =========================================

# TPM bindings were active in the running server, and continuum settings
# were present. tmux-resurrect is included because continuum uses it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'vaaleyard/tmux-dotbar'

set -g @tpm_plugins ' \
  tmux-plugins/tpm \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
  vaaleyard/tmux-dotbar \
'

# --- option ---
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'
# Dotbar options
set -g @tmux-dotbar-bg 'default'
set -g @tmux-dotbar-fg 'white'
set -g @tmux-dotbar-fg-current 'white,bold'
set -g @tmux-dotbar-fg-session 'magenta'
set -g @tmux-dotbar-fg-prefix 'magenta'
set -g @tmux-dotbar-position "top"

# TPM must stay at the bottom.
run '~/.tmux/plugins/tpm/tpm'

# EOF
