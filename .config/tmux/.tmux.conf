# ===================
# Core
# ===================
unbind C-b
set -g prefix C-j
bind C-j send-prefix
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -s set-clipboard on
set -g allow-passthrough on

# ===================
# Terminal / colors
# ===================
# Preserve application RGB and use the terminal ANSI palette for UI.
set -s default-terminal 'tmux-256color'
set -s terminal-overrides[100] '*:RGB'
set -s theme terminal

# ===================
# Pane borders
# ===================
set -g pane-active-border-style 'fg=magenta'
set -g pane-border-style 'fg=black'

# tmux 3.8 fills popups with themedarkgrey; use the terminal background so
# popups match panes (including Ghostty's background opacity).
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=white,bg=default'

# ===================
# Split / reload
# ===================
bind - split-window -v
bind ^ split-window -h
bind r source-file ~/.config/tmux/.tmux.conf \; display-message 'Reloaded!'

# ===================
# Copy mode
# ===================
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel

# マウスホイールでのスクロールを1行ずつに変更
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# ===================
# Layout
# ===================
# Prefix + :autogrid (2-6 panes)
set -s command-alias[100] "autogrid=if -F '#{==:#{window_panes},2}' { select-layout even-vertical } { if -F '#{==:#{window_panes},3}' { select-layout 'b426,224x53,0,0{111x53,0,0,15,112x53,112,0[112x26,112,0,16,112x26,112,27,17]}' } { if -F '#{==:#{window_panes},4}' { select-layout '947a,224x53,0,0[224x26,0,0{112x26,0,0,18,111x26,113,0,21},224x26,0,27{112x26,0,27,19,111x26,113,27,20}]' } { if -F '#{==:#{window_panes},5}' { select-layout 'b1de,224x53,0,0{74x53,0,0,24,74x53,75,0[74x26,75,0,27,74x26,75,27,29],74x53,150,0[74x26,150,0,28,74x26,150,27,30]}' } { if -F '#{==:#{window_panes},6}' { select-layout '4126,224x53,0,0[224x26,0,0{74x26,0,0,31,74x26,75,0,33,74x26,150,0,34},224x26,0,27{74x26,0,27,32,74x26,75,27,35,74x26,150,27,36}]' } { display-message 'autogrid: supports 2-6 panes' } } } } }"

# ===================
# TPM / session persistence
# ===================
# TPM does not discover .config/tmux/.tmux.conf; keep one explicit plugin list.
# Load continuum after dotbar so its autosave command stays in status-right.
set -g @tpm_plugins 'tmux-plugins/tpm tmux-plugins/tmux-resurrect sainnhe/tmux-fzf vaaleyard/tmux-dotbar tmux-plugins/tmux-continuum'
set -g @continuum-restore on
set -g @continuum-boot on
set -g @continuum-boot-options ghostty

# ===================
# Status bar / dotbar
# ===================
# Override dotbar's RGB defaults with terminal colors.
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-fg white
set -g @tmux-dotbar-fg-current 'white,bold'
set -g @tmux-dotbar-fg-session magenta
set -g @tmux-dotbar-fg-prefix magenta
set -g @tmux-dotbar-position top

# ===================
# fzf
# ===================
# tmux-fzf reads environment variables. Prefix + F opens its menu.
TMUX_FZF_ORDER='session|window|pane|command|keybinding'
TMUX_FZF_OPTIONS='-p -w 85% -h 80% -m'

# Prefix + f: switch window (replaces find-window). Pass the client so that
# the switch targets the terminal that pressed the key.
bind f run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Prefix + g: lazygit in the current pane's directory. tmux 3.8 binds g to
# the floating pane move table by default; keep that on Prefix + G.
bind G switch-client -T move
bind g if-shell 'command -v lazygit >/dev/null' {
  display-popup -E -w 90% -h 80% -d '#{pane_current_path}' lazygit
} {
  display-message 'lazygit: command not found'
}

# Prefix + t: copy the absolute path of a file under the current pane's
# directory to a tmux buffer, and to the clipboard (pbcopy, or OSC 52 via
# set-clipboard). Replaces clock-mode.
bind t display-popup -E -w 85% -h 80% -d '#{pane_current_path}' 'f=$(fzf --no-height --scheme=path --prompt="copy path> " --walker=file,follow,hidden --walker-skip=.git,node_modules,.venv,.direnv,__pycache__ --preview "bat --color=always --style=numbers --line-range=:500 -- {} 2>/dev/null || head -n 500 -- {}") && f="$PWD/$f" && printf "%s" "$f" | tmux load-buffer -w - && { ! command -v pbcopy >/dev/null || printf "%s" "$f" | pbcopy; } && tmux display-message -l "Copied: $f"'

run '~/.tmux/plugins/tpm/tpm'

# Dotbar hardcodes the zoom icon RGB; preserve its format with an ANSI color.
set -g window-status-current-format '#[fg=white,bold]#{E:window-status-format}#[fg=cyan]#{?window_zoomed_flag,󰊓,}'
