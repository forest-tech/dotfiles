# ===================
# Core
# ===================
# SSH prefix: C-o
unbind C-b
set -g prefix C-o
bind C-o send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0

# ===================
# Terminal
# ===================
set -g default-terminal "tmux-256color"

# ===================
# Pane navigation / resize
# ===================
# Vim-style navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vim-style resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ===================
# Status bar
# ===================

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left

# Hostname + session name
set -g status-left ' SSH:#{host_short} [#S] | '
set -g status-left-length 40

# Window list
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W* '
set -g window-status-current-style 'bold'

# Keep the right side empty
set -g status-right ''

# ===================
# Split / reload
# ===================
bind - split-window -v
bind ^ split-window -h
bind r source-file ~/.tmux.conf \; display-message 'Reloaded!'

# ===================
# Copy mode
# ===================
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===================
# Layout
# ===================
# Prefix + :autogrid (2-6 panes)
set -s command-alias[100] "autogrid=if -F '#{==:#{window_panes},2}' { select-layout even-vertical } { if -F '#{==:#{window_panes},3}' { select-layout 'b426,224x53,0,0{111x53,0,0,15,112x53,112,0[112x26,112,0,16,112x26,112,27,17]}' } { if -F '#{==:#{window_panes},4}' { select-layout '947a,224x53,0,0[224x26,0,0{112x26,0,0,18,111x26,113,0,21},224x26,0,27{112x26,0,27,19,111x26,113,27,20}]' } { if -F '#{==:#{window_panes},5}' { select-layout 'b1de,224x53,0,0{74x53,0,0,24,74x53,75,0[74x26,75,0,27,74x26,75,27,29],74x53,150,0[74x26,150,0,28,74x26,150,27,30]}' } { if -F '#{==:#{window_panes},6}' { select-layout '4126,224x53,0,0[224x26,0,0{74x26,0,0,31,74x26,75,0,33,74x26,150,0,34},224x26,0,27{74x26,0,27,32,74x26,75,27,35,74x26,150,27,36}]' } { display-message 'autogrid: supports 2-6 panes' } } } } }"

# EOF
