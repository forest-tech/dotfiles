[general]
import = ["~/.config/alacritty/themes/themes/iceberg.toml"]

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"

[window]
opacity = 0.8
decorations = "Buttonless"

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec /opt/homebrew/bin/tmux -f \"$HOME/.config/tmux/.tmux.conf\""]
