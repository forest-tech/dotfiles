[general]
import = ["~/.config/alacritty/themes/themes/iceberg.toml"]

[font]
size = 11.75
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
# thickness = 0.15

[cursor.style]
shape = "Beam"
blinking = "Never"

[window]
opacity = 0.8
decorations = "Buttonless"

# 起動時に画面 (1470x956pt) の約 90% になる大きさ。セル 7x15.5pt から逆算
[window.dimensions]
columns = 188
lines = 54

[colors]
transparent_background_colors = true

[terminal.shell]
program = "/bin/zsh"
args = [
  "-l",
  "-c",
  "if /opt/homebrew/bin/tmux -f \"$HOME/.config/tmux/.tmux.conf\" has-session 2>/dev/null; then exec /opt/homebrew/bin/tmux -f \"$HOME/.config/tmux/.tmux.conf\" attach-session; else exec /opt/homebrew/bin/tmux -f \"$HOME/.config/tmux/.tmux.conf\" new-session -s scratch; fi"
]
